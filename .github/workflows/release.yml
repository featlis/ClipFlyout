name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 0.3.0)'
        required: true
        default: '0.4.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Run Build & Package Script
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Generate SHA256 Checksums
        shell: pwsh
        working-directory: dist
        run: |
          Get-FileHash -Algorithm SHA256 * | ForEach-Object {
            "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding ascii checksums-sha256.txt
          Get-Content checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ClipFlyout ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ClipFlyout-Setup-v${{ steps.version.outputs.version }}.exe
            dist/ClipFlyout-v${{ steps.version.outputs.version }}-win-x64.zip
            dist/checksums-sha256.txt
