name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $innoDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path $innoDir) {
            Write-Output $innoDir >> $env:GITHUB_PATH
          }

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Run Tests
        shell: pwsh
        run: |
          dotnet test tests/ClipFlyout.Tests/ClipFlyout.Tests.csproj -c Release

      - name: Run Build & Package Script
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Generate SHA256 Checksums
        shell: pwsh
        working-directory: dist
        run: |
          $files = Get-ChildItem -File | Where-Object { $_.Name -ne "checksums-sha256.txt" }
          $hashes = foreach ($f in $files) {
            $h = Get-FileHash -Algorithm SHA256 $f.FullName
            "$($h.Hash)  $($f.Name)"
          }
          $hashes | Set-Content -Encoding ascii checksums-sha256.txt
          Get-Content checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ClipFlyout ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ClipFlyout-Setup-v${{ steps.version.outputs.version }}.exe
            dist/ClipFlyout-v${{ steps.version.outputs.version }}-win-x64.zip
            dist/checksums-sha256.txt
